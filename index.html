<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pony 综合语法复习</title>
  <style>
    :root {
      --ink: #243042;
      --muted: #687386;
      --paper: #fffdf8;
      --blue: #2768b2;
      --blue-soft: #eaf4ff;
      --green: #27845a;
      --green-soft: #e9f8ef;
      --orange: #d66b24;
      --orange-soft: #fff1e7;
      --red: #b9424d;
      --line: #dce4ee;
      --shadow: 0 18px 48px rgba(46, 67, 91, 0.13);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 5%, rgba(255, 210, 103, 0.28), transparent 24rem),
        radial-gradient(circle at 94% 15%, rgba(87, 179, 255, 0.18), transparent 28rem),
        #f5f9fc;
    }

    button, select { font: inherit; }

    .app {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 18px;
    }

    .hero, .card, .result {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255, 253, 248, 0.96);
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 24px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: center;
    }

    .kicker {
      margin: 0 0 6px;
      color: var(--green);
      font-weight: 900;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 1.08;
    }

    .hero p {
      max-width: 760px;
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.75;
    }

    .home-link, .primary, .secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      border: 0;
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 900;
      text-decoration: none;
      cursor: pointer;
    }

    .home-link, .secondary {
      color: var(--blue);
      background: var(--blue-soft);
    }

    .primary {
      color: #fff;
      background: var(--blue);
    }

    .primary:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .pony-badge {
      width: 116px;
      height: 116px;
      display: grid;
      place-items: center;
      border: 4px solid #70422d;
      border-radius: 46% 54% 48% 52%;
      color: #fff;
      background: linear-gradient(145deg, #dc9a57, #a95c35);
      font-size: 3.3rem;
      box-shadow: inset 0 -10px 0 rgba(77, 42, 28, 0.12);
    }

    .toolbar {
      margin: 18px 0;
      padding: 16px;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 2fr;
      gap: 14px;
      align-items: end;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,0.9);
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-weight: 800;
    }

    select {
      width: 100%;
      min-height: 46px;
      padding: 9px 12px;
      border: 1px solid #bdc9d8;
      border-radius: 10px;
      color: var(--ink);
      background: #fff;
    }

    .progress-wrap {
      display: grid;
      gap: 8px;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-weight: 800;
    }

    .progress {
      height: 12px;
      overflow: hidden;
      border-radius: 999px;
      background: #e9eef4;
    }

    .progress > div {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #2b87c8, #42a56f);
      transition: width 0.25s ease;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 18px;
    }

    .card { padding: clamp(18px, 4vw, 30px); }

    .section-label {
      margin: 0 0 6px;
      color: var(--orange);
      font-weight: 900;
    }

    .question {
      margin: 10px 0 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.35rem, 4vw, 2.05rem);
      line-height: 1.55;
    }

    .instruction {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.7;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .choice {
      min-height: 58px;
      border: 2px solid #cbd7e4;
      border-radius: 14px;
      padding: 11px;
      color: var(--ink);
      background: #fff;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .choice:hover { transform: translateY(-2px); border-color: var(--blue); }
    .choice.wrong { border-color: #e49aa1; color: var(--red); background: #fff4f5; }
    .choice.correct { border-color: #70bd91; color: #176840; background: var(--green-soft); }
    .choice:disabled { cursor: default; transform: none; }

    .feedback {
      display: none;
      margin-top: 18px;
      padding: 16px;
      border-radius: 14px;
      line-height: 1.7;
    }

    .feedback.show { display: block; }
    .feedback.bad { border: 1px solid #efb8a1; background: var(--orange-soft); }
    .feedback.good { border: 1px solid #a9d9ba; background: var(--green-soft); }
    .feedback strong { display: block; margin-bottom: 5px; }
    .feedback p { margin: 4px 0; }

    .actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 18px;
    }

    .side {
      align-self: start;
      position: sticky;
      top: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      background: rgba(255,255,255,0.94);
    }

    .side h2 { margin: 0 0 12px; }
    .side ol { margin: 0; padding-left: 1.25rem; color: var(--muted); line-height: 1.8; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 18px; }
    .stat { padding: 12px; border-radius: 12px; text-align: center; background: #f2f6fa; }
    .stat b { display: block; margin-top: 3px; color: var(--blue); font-size: 1.35rem; }

    .result {
      display: none;
      padding: clamp(20px, 5vw, 38px);
    }

    .result.show { display: block; }
    .result h2 { margin-top: 0; font-size: clamp(1.8rem, 5vw, 3rem); }
    .stars { color: #efa91f; font-size: clamp(2rem, 7vw, 3.6rem); letter-spacing: 4px; }

    .review-list {
      display: grid;
      gap: 12px;
      margin: 20px 0;
    }

    .review-item {
      border-left: 5px solid var(--orange);
      border-radius: 10px;
      padding: 13px 15px;
      background: #fff7ec;
      line-height: 1.7;
    }

    .review-item strong { display: block; }
    .privacy { margin-top: 16px; color: var(--muted); font-size: 0.92rem; }

    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      .side { position: static; }
      .hero { grid-template-columns: 1fr; }
      .pony-badge { display: none; }
    }

    @media (max-width: 580px) {
      .app { padding: 10px; }
      .hero, .card, .result { border-radius: 15px; }
      .toolbar { grid-template-columns: 1fr; }
      .choices { grid-template-columns: 1fr; }
      .actions { flex-direction: column-reverse; }
      .actions button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="kicker">Pony English · 基础拆解练习</p>
        <h1>综合语法复习</h1>
        <p>一次只完成一个空。先看句子，再找时间词或回答方向，最后选择。答错不要怕，中文意思和判断步骤会帮你重新思考。</p>
        <p><button class="home-link" id="topRestartBtn" type="button">重新开始全部题目</button></p>
      </div>
      <div class="pony-badge" aria-hidden="true">P</div>
    </header>

    <section class="toolbar" id="toolbar">
      <label>
        选择复习关卡
        <select id="levelSelect"></select>
      </label>
      <div class="progress-wrap">
        <div class="progress-row">
          <span id="progressText">第 1 题</span>
          <span id="levelScore">本关答对 0 题</span>
        </div>
        <div class="progress" aria-label="本关完成进度"><div id="progressBar"></div></div>
      </div>
    </section>

    <section class="layout" id="practiceArea">
      <article class="card">
        <p class="section-label" id="sectionLabel"></p>
        <h2 class="question" id="questionText"></h2>
        <p class="instruction">请选择最合适的答案。选错后先读中文和解析，再重新选择。</p>
        <div class="choices" id="choices"></div>
        <div class="feedback" id="feedback" aria-live="polite"></div>
        <div class="actions">
          <button class="secondary" id="prevBtn" type="button">上一题</button>
          <button class="primary" id="nextBtn" type="button" disabled>下一题</button>
        </div>
      </article>

      <aside class="side">
        <h2>三步判断法</h2>
        <ol>
          <li>读完整句，先理解大意。</li>
          <li>圈出时间词、数量词或回答内容。</li>
          <li>检查主语、单复数和动词形式。</li>
        </ol>
        <div class="stat-grid">
          <div class="stat">总进度<b id="totalDone">0/82</b></div>
          <div class="stat">错题数<b id="mistakeCount">0</b></div>
        </div>
        <p class="privacy">本页不收集姓名，不上传成绩，刷新页面后记录会清空。</p>
      </aside>
    </section>

    <section class="result" id="resultArea">
      <p class="kicker">Review complete</p>
      <h2 id="resultTitle">你完成了全部复习！</h2>
      <div class="stars" id="resultStars">★★★★★</div>
      <p id="resultText"></p>
      <div class="review-list" id="reviewList"></div>
      <div class="actions">
        <button class="secondary" id="resultTopBtn" type="button">回到练习开头</button>
        <button class="primary" id="restartBtn" type="button">重新练习全部题目</button>
      </div>
    </section>
  </main>

  <script>
    const groups = [
      {
        title: "第 1 关：疑问词",
        questions: [
          ["— ___ is Mike going to Shanghai? — He’s going this evening.", "迈克什么时候去上海？——他今天晚上去。", ["What", "When", "Where", "Why"], "When", "回答给出了 this evening（今天晚上），要选择询问时间的疑问词。", "疑问词：询问时间"],
          ["— ___ is this skirt? — It’s 66 yuan.", "这条短裙多少钱？——66元。", ["How old", "How many", "How much", "Which"], "How much", "回答是价格，应该选择询问价钱的表达。", "疑问词：询问价格"],
          ["— ___ are you going to do today? — We’re going to have an art lesson.", "你们今天打算做什么？——我们打算上一节美术课。", ["What", "Who", "Where", "When"], "What", "回答说的是准备做的事情，要选择询问事情的疑问词。", "疑问词：询问事情"],
          ["— ___ is your art teacher? — Miss Zhou.", "谁是你的美术老师？——周老师。", ["Which", "Who", "Why", "How"], "Who", "回答是一个人名，应该选择询问人物的疑问词。", "疑问词：询问人物"],
          ["— ___ is the museum shop? — It’s next to the library.", "博物馆商店在哪里？——它在图书馆旁边。", ["Where", "When", "What", "Who"], "Where", "回答 next to the library 表示地点，要选择询问位置的疑问词。", "疑问词：询问地点"],
          ["— ___ can we get there? — Take the No. 57 bus.", "我们怎样到那里？——乘57路公交车。", ["How", "Why", "Where", "Which"], "How", "回答介绍的是到达方式，要选择询问方式的疑问词。", "疑问词：询问方式"],
          ["— ___ is your brother? — He’s 12 years old.", "你弟弟多大？——他12岁。", ["How much", "How old", "How many", "When"], "How old", "回答是年龄，要选择询问年龄的表达。", "疑问词：询问年龄"],
          ["— ___ books do you have? — I have six.", "你有多少本书？——我有六本。", ["How much", "How old", "How many", "Which"], "How many", "books 是可数名词复数，回答 six 是数量，要选择询问可数数量的表达。", "疑问词：可数名词数量"],
          ["— ___ season do you like best? — Winter.", "你最喜欢哪个季节？——冬天。", ["What", "Which", "When", "Where"], "Which", "回答是在有限的几个季节中作选择，要选择表示“哪一个”的疑问词。", "疑问词：有限范围选择"],
          ["— ___ do you come to school on foot? — Because it’s very near.", "你为什么步行来学校？——因为学校很近。", ["How", "Why", "When", "Where"], "Why", "回答以 Because 开头说明原因，要选择询问原因的疑问词。", "疑问词：询问原因"]
        ]
      },
      {
        title: "第 2 关：There be 句型",
        questions: [
          ["Look! There ___ a cap under the tree.", "看！树下有一顶帽子。", ["is", "are", "was", "were"], "is", "Look 表示现在；a cap 是单数，所以 be 动词用现在时单数形式。", "There be：现在时单数"],
          ["There ___ lots of dinosaurs many years ago.", "许多年前有很多恐龙。", ["is", "are", "was", "were"], "were", "many years ago 表示过去；dinosaurs 是复数，所以用过去时复数形式。", "There be：过去时复数"],
          ["There ___ some ice cream in the box.", "盒子里有一些冰激凌。", ["is", "are", "was", "were"], "is", "ice cream 在这里是不可数名词，句子没有过去时间词，所以用现在时单数形式。", "There be：不可数名词"],
          ["There ___ rubbish in the river ten years ago.", "十年前河里有垃圾。", ["is", "are", "was", "were"], "was", "ten years ago 表示过去；rubbish 是不可数名词，所以用过去时单数形式。", "There be：过去时不可数名词"],
          ["Fish ___ dead ten years ago.", "十年前鱼死了。", ["is", "are", "was", "were"], "were", "ten years ago 表示过去；fish 在句中表示许多鱼，要使用过去时复数形式。", "Be 动词：过去时复数"],
          ["___ there a book and two pens on the desk?", "桌子上有一本书和两支钢笔吗？", ["Is", "Are", "Was", "Were"], "Is", "句子没有过去时间词；there be 遵循就近原则，最靠近的是 a book。", "There be：一般疑问句与就近原则"],
          ["There ___ a rubber in your pencil box.", "你的铅笔盒里有一块橡皮。", ["is", "are"], "is", "a rubber 是单数名词，所以选择单数形式。", "There be：单数"],
          ["There ___ two books on the desk.", "桌子上有两本书。", ["is", "are"], "are", "two books 是复数名词，所以选择复数形式。", "There be：复数"],
          ["There ___ an apple and some oranges in the fridge.", "冰箱里有一个苹果和一些橙子。", ["is", "are"], "is", "there be 看最靠近 be 动词的名词；an apple 是单数。", "There be：就近原则"],
          ["___ there a pen in your book yesterday?", "昨天你的书里有一支钢笔吗？", ["Is", "Was"], "Was", "yesterday 表示过去；a pen 是单数。", "There be：过去时疑问句"],

          ["This milk isn’t very cold, ___ it?", "这牛奶不是很凉，是吗？", ["is", "does"], "is", "前句的谓语是 isn’t，反意疑问部分继续使用 be 动词。", "反意疑问句：前后助动词一致"],

        questions: [

          ["I ___ nothing in my pocket. But ___ iPhone and two computers on the table.", "我口袋里什么也没有，但是桌上有一部手机和两台电脑。", ["have; there is an", "has; I have an", "there be; there are"], "have; there is an", "第一空主语 I 表示拥有；第二空是 there be 句型，并根据最靠近的单数名词判断。", "have 与 there be；就近原则"],
          ["___ fine weather it is!", "多么好的天气啊！", ["What", "What a", "How"], "What", "weather 是不可数名词，结构是 What + 形容词 + 不可数名词。", "感叹句：不可数名词"],

        ]
      },
      {
        title: "第 5 关：生日短文",
        questions: [
          ["Last Sunday was ___ birthday.", "上周日是我的生日。", ["I", "me", "my", "mine"], "my", "birthday 是名词，前面需要使用形容词性物主代词，表示“我的”。", "物主代词：my + 名词"],
          ["It was my ___ birthday.", "那是我的十二岁生日。", ["twelve", "twelfth", "twenty", "twentieth"], "twelfth", "表示“第几个生日”要使用序数词，而不是基数词。", "序数词：twelve—twelfth"],
          ["It was ___.", "天气晴朗。", ["sun", "sunny", "sunned", "sunning"], "sunny", "was 后需要形容词作表语，表示天气晴朗。", "词性转换：sun—sunny"],
          ["In the morning, I ___ fishing with my dad and mum.", "早上，我和爸爸妈妈去钓鱼了。", ["go", "goes", "went", "going"], "went", "短文讲述上周日的事情，要使用 go 的过去式。", "一般过去时：go—went"],
          ["We went fishing by the ___.", "我们在河边钓鱼。", ["river", "sun", "pilot", "beef"], "river", "钓鱼地点应是河边；by the... 表示“在……旁边”。", "语境选词：地点"],
          ["At noon, we went to a western restaurant and ___ some delicious food.", "中午，我们去了一家西餐厅，吃了一些美味的食物。", ["eat", "ate", "eats", "eating"], "ate", "went 和空格是并列的过去动作，eat 要变成过去式。", "一般过去时：eat—ate"],
          ["___ is my favourite food.", "牛肉是我最喜欢的食物。", ["Pilot", "River", "Beef", "Sun"], "Beef", "此处需要一种食物名称作主语。", "语境选词：食物"],
          ["In the afternoon, my family ___ the museum.", "下午，我的家人参观了博物馆。", ["visit", "visits", "visited", "visiting"], "visited", "短文讲述过去发生的活动，visit 使用过去式。", "一般过去时：规则动词"],
          ["I am going to be a ___ one day.", "有一天我打算成为一名飞行员。", ["pilot", "river", "beef", "sun"], "pilot", "be a... 后面应接职业名称，并与前面的 plane show 呼应。", "语境选词：职业"],
          ["It was a ___ day!", "那是快乐的一天！", ["happily", "happy", "happiness", "happier"], "happy", "day 是名词，前面需要形容词修饰。", "词性：形容词修饰名词"]
        ]
      },
      {
        title: "第 6 关：do 与 play",
        questions: [
          ["My mum ___ the cleaning every weekend.", "我妈妈每个周末都打扫卫生。", ["do", "doing", "does", "did"], "does", "every weekend 表示经常发生；主语 My mum 是第三人称单数。", "一般现在时：第三人称单数"],
          ["But last weekend I ___ the cleaning.", "但是上周末我打扫了卫生。", ["do", "doing", "does", "did"], "did", "last weekend 表示过去，do 使用过去式。", "一般过去时：do—did"],
          ["I don’t like ___ the cleaning.", "我不喜欢打扫卫生。", ["do", "doing", "does", "did"], "doing", "like 后面表示喜欢做某事，可以接动词-ing。", "固定搭配：like doing"],
          ["She couldn’t ___ the cleaning.", "她不能打扫卫生。", ["do", "doing", "does", "did"], "do", "couldn’t 是情态动词的否定形式，后面接动词原形。", "情态动词 + 动词原形"],
          ["So I have to ___ the cleaning myself.", "所以我不得不自己打扫卫生。", ["do", "doing", "does", "did"], "do", "have to 后面接动词原形。", "固定结构：have to + 动词原形"],
          ["Mary liked ___ computer games before.", "玛丽以前喜欢玩电脑游戏。", ["play", "playing", "plays", "played"], "playing", "liked 后面表示喜欢做某事，接动词-ing。", "固定搭配：like doing"],
          ["She ___ computer games very well before.", "她以前电脑游戏玩得很好。", ["play", "playing", "plays", "played"], "played", "before 表示过去，句子需要一般过去时。", "一般过去时：规则动词"],
          ["But now she likes ___ the piano.", "但是现在她喜欢弹钢琴。", ["play", "playing", "plays", "played"], "playing", "likes 后面接动词-ing，表示喜欢做某事。", "固定搭配：like doing"],
          ["She ___ the piano every day.", "她每天弹钢琴。", ["play", "playing", "plays", "played"], "plays", "every day 表示一般现在时；主语 She 是第三人称单数。", "一般现在时：第三人称单数"],
          ["She can ___ the piano very well.", "她钢琴弹得很好。", ["play", "playing", "plays", "played"], "play", "can 后面必须接动词原形。", "情态动词 can + 动词原形"]
        ]
      },
      {
        title: "第 7 关：北京旅行",
        questions: [
          ["___ Saturday morning, we are going to visit the Great Wall.", "星期六早上，我们打算参观长城。", ["In", "On", "At", "By"], "On", "具体某一天的上午、下午或晚上前使用时间介词 on。", "时间介词：on + 具体某天"],
          ["We are going to ___ the Great Wall.", "我们打算参观长城。", ["visit", "visiting", "visited", "visits"], "visit", "be going to 后面接动词原形。", "一般将来时：be going to + 动词原形"],
          ["We will go there by ___.", "我们将乘公交车去那里。", ["bus", "plan", "visit", "sure"], "bus", "by 后面直接接交通工具名称，表示乘坐方式。", "交通方式：by + 交通工具"],
          ["Then we ___ to watch Peking Opera.", "然后我们计划去看京剧。", ["plan", "plans", "planned", "planning"], "plan", "全文介绍旅行安排；主语 we 后使用动词原形，plan to do 表示计划做某事。", "固定搭配：plan to do"],
          ["We plan to watch Peking Opera ___ the evening.", "我们计划晚上看京剧。", ["on", "at", "in", "by"], "in", "泛指“在晚上”使用 in the evening。", "时间介词：in the evening"],
          ["On Sunday morning, we ___ go to the Summer Palace.", "星期日上午，我们将去颐和园。", ["will", "going", "have", "sure"], "will", "空格后是动词原形 go，句子描述将来安排，需要将来助动词。", "一般将来时：will + 动词原形"],
          ["In the afternoon, we are ___ to visit the Forbidden City.", "下午，我们打算参观故宫。", ["go", "going", "will", "plan"], "going", "are 与 to visit 之间需要 going，组成 be going to。", "一般将来时：be going to"],
          ["We will ___ more about Chinese history.", "我们将更多地了解中国历史。", ["learn", "learned", "learning", "learns"], "learn", "will 后面接动词原形。", "一般将来时：will + 动词原形"],
          ["I am ___ we will have a good time.", "我确信我们会玩得很开心。", ["sure", "plan", "learn", "going"], "sure", "am 后面需要形容词；be sure 表示“确信”。", "固定搭配：be sure"],
          ["We will ___ a good time.", "我们会玩得很开心。", ["have", "has", "had", "having"], "have", "will 后面接动词原形；have a good time 是固定搭配。", "固定搭配：have a good time"]
        ]
      },
      {
        title: "第 8 关：Martin 的故事",
        questions: [
          ["Martin ___ some holidays.", "马丁有一段假期。", ["have", "has", "had", "having"], "had", "故事讲述过去发生的事情，have 要使用过去式。", "一般过去时：have—had"],
          ["He ___ to go to a quiet place by train.", "他想乘火车去一个安静的地方。", ["want", "wants", "wanted", "wanting"], "wanted", "故事使用一般过去时，want 变为规则过去式。", "一般过去时：规则动词"],
          ["He ___ on his best clothes.", "他穿上了自己最好的衣服。", ["put", "puts", "putting", "putted"], "put", "故事是过去时；put 的过去式仍然是 put。", "一般过去时：put—put"],
          ["He ___ a small bag.", "他带了一个小包。", ["take", "takes", "took", "taking"], "took", "故事是过去时，take 要变成不规则过去式。", "一般过去时：take—took"],
          ["He ___ on the train.", "他上了火车。", ["get", "gets", "got", "getting"], "got", "get on 表示“上车”；故事是过去时，get 变为过去式。", "一般过去时：get—got"],
          ["The train began to ___.", "火车开始开动。", ["leave", "left", "leaves", "leaving"], "leave", "begin to do 表示“开始做某事”，to 后接动词原形。", "固定结构：begin to + 动词原形"],
          ["He ___ angry.", "他生气了。", ["be", "is", "was", "were"], "was", "故事是过去时；主语 He 是单数，be 动词用过去时单数。", "Be 动词过去时：was"],
          ["He ___, “Someone will find my hat and bag.”", "他说：“有人会找到我的帽子和包。”", ["say", "says", "said", "saying"], "said", "故事中的“说”已经发生，say 使用过去式。", "一般过去时：say—said"],
          ["Someone will ___ my hat and bag.", "有人会找到我的帽子和包。", ["find", "found", "finds", "finding"], "find", "will 后面接动词原形。", "一般将来时：will + 动词原形"],
          ["Then he will ___ me the bag and the hat.", "然后他会把包和帽子寄给我。", ["send", "sent", "sends", "sending"], "send", "will 后面接动词原形；send me... 表示“把……寄给我”。", "一般将来时：will + 动词原形"]
        ]
      }
    ];

    const allQuestions = groups.flatMap((group, groupIndex) =>
      group.questions.map((item, questionIndex) => ({
        prompt: item[0],
        translation: item[1],
        choices: item[2],
        answer: item[3],
        analysis: item[4],
        point: item[5],
        groupIndex,
        questionIndex
      }))
    );

    const state = {
      groupIndex: 0,
      questionIndex: 0,
      answers: new Map(),
      mistakes: new Map()
    };

    const els = {
      levelSelect: document.getElementById("levelSelect"),
      progressText: document.getElementById("progressText"),
      levelScore: document.getElementById("levelScore"),
      progressBar: document.getElementById("progressBar"),
      sectionLabel: document.getElementById("sectionLabel"),
      questionText: document.getElementById("questionText"),
      choices: document.getElementById("choices"),
      feedback: document.getElementById("feedback"),
      prevBtn: document.getElementById("prevBtn"),
      nextBtn: document.getElementById("nextBtn"),
      totalDone: document.getElementById("totalDone"),
      mistakeCount: document.getElementById("mistakeCount"),
      practiceArea: document.getElementById("practiceArea"),
      toolbar: document.getElementById("toolbar"),
      resultArea: document.getElementById("resultArea"),
      resultTitle: document.getElementById("resultTitle"),
      resultStars: document.getElementById("resultStars"),
      resultText: document.getElementById("resultText"),
      reviewList: document.getElementById("reviewList"),
      restartBtn: document.getElementById("restartBtn")
    };

    function questionKey(groupIndex = state.groupIndex, questionIndex = state.questionIndex) {
      return groupIndex + "-" + questionIndex;
    }

    function currentQuestion() {
      return groups[state.groupIndex].questions[state.questionIndex];
    }

    function answeredCount() {
      return state.answers.size;
    }

    function renderLevelOptions() {
      groups.forEach((group, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = group.title + "（" + group.questions.length + "题）";
        els.levelSelect.appendChild(option);
      });
    }

    function renderQuestion() {
      const group = groups[state.groupIndex];
      const item = currentQuestion();
      const key = questionKey();
      const saved = state.answers.get(key);
      const wrongChoices = state.mistakes.get(key)?.choices || [];

      els.levelSelect.value = state.groupIndex;
      els.sectionLabel.textContent = group.title;
      els.questionText.textContent = item[0];
      els.progressText.textContent = "第 " + (state.questionIndex + 1) + " / " + group.questions.length + " 题";
      els.progressBar.style.width = ((state.questionIndex + 1) / group.questions.length * 100) + "%";

      const correctInLevel = [...state.answers.entries()].filter(([savedKey, value]) =>
        savedKey.startsWith(state.groupIndex + "-") && value.correct
      ).length;
      els.levelScore.textContent = "本关完成 " + correctInLevel + " 题";
      els.totalDone.textContent = answeredCount() + "/" + allQuestions.length;
      els.mistakeCount.textContent = state.mistakes.size;
      els.prevBtn.disabled = state.groupIndex === 0 && state.questionIndex === 0;
      els.nextBtn.disabled = !saved?.correct;
      els.nextBtn.textContent =
        state.groupIndex === groups.length - 1 && state.questionIndex === group.questions.length - 1
          ? "查看错题总结"
          : (state.questionIndex === group.questions.length - 1 ? "进入下一关" : "下一题");

      els.choices.innerHTML = "";
      item[2].forEach((choice) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice";
        button.textContent = choice;
        if (saved?.correct) {
          button.disabled = true;
          if (choice === item[3]) button.classList.add("correct");
        } else if (wrongChoices.includes(choice)) {
          button.classList.add("wrong");
          button.disabled = true;
        }
        button.addEventListener("click", () => choose(choice));
        els.choices.appendChild(button);
      });

      if (saved?.correct) {
        showGood(item);
      } else {
        els.feedback.className = "feedback";
        els.feedback.innerHTML = "";
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function choose(choice) {
      const item = currentQuestion();
      const key = questionKey();
      if (choice === item[3]) {
        state.answers.set(key, { correct: true });
        renderQuestion();
        return;
      }

      const record = state.mistakes.get(key) || {
        choices: [],
        point: item[5],
        translation: item[1],
        prompt: item[0]
      };
      if (!record.choices.includes(choice)) record.choices.push(choice);
      state.mistakes.set(key, record);
      showWrong(item, choice);
      renderChoiceStates(choice);
      els.mistakeCount.textContent = state.mistakes.size;
    }

    function renderChoiceStates(latestChoice) {
      [...els.choices.children].forEach((button) => {
        if (button.textContent === latestChoice) {
          button.classList.add("wrong");
          button.disabled = true;
        }
      });
    }

    function showWrong(item, choice) {
      els.feedback.className = "feedback bad show";
      els.feedback.innerHTML =
        "<strong>再想一想，你刚才选择了 “" + escapeHtml(choice) + "”。</strong>" +
        "<p><b>中文意思：</b>" + escapeHtml(item[1]) + "</p>" +
        "<p><b>题目解析：</b>" + escapeHtml(item[4]) + " 先不要找答案，按照这个线索再选一次。</p>";
    }

    function showGood(item) {
      els.feedback.className = "feedback good show";
      els.feedback.innerHTML =
        "<strong>答对了，做得很好！</strong>" +
        "<p><b>完整句子：</b>" + escapeHtml(item[0].replace("___", item[3])) + "</p>" +
        "<p><b>中文意思：</b>" + escapeHtml(item[1]) + "</p>";
    }

    function goNext() {
      const group = groups[state.groupIndex];
      if (state.questionIndex < group.questions.length - 1) {
        state.questionIndex += 1;
        renderQuestion();
        return;
      }
      if (state.groupIndex < groups.length - 1) {
        state.groupIndex += 1;
        state.questionIndex = 0;
        renderQuestion();
        return;
      }
      const unfinished = findFirstUnfinished();
      if (unfinished) {
        state.groupIndex = unfinished.groupIndex;
        state.questionIndex = unfinished.questionIndex;
        renderQuestion();
        els.feedback.className = "feedback bad show";
        els.feedback.innerHTML =
          "<strong>最后一步：还有题目没有完成。</strong>" +
          "<p>页面已经带你回到第一道未完成的题。全部 82 题完成后，才能查看完整错题总结。</p>";
        return;
      }
      showResult();
    }

    function goPrevious() {
      if (state.questionIndex > 0) {
        state.questionIndex -= 1;
      } else if (state.groupIndex > 0) {
        state.groupIndex -= 1;
        state.questionIndex = groups[state.groupIndex].questions.length - 1;
      }
      renderQuestion();
    }

    function showResult() {
      const total = allQuestions.length;
      const mistakeTotal = state.mistakes.size;
      const firstTryCorrect = total - mistakeTotal;
      const ratio = firstTryCorrect / total;
      const stars = Math.max(1, Math.round(ratio * 5));

      els.practiceArea.style.display = "none";
      els.toolbar.style.display = "none";
      els.resultArea.classList.add("show");
      els.resultStars.textContent = "★".repeat(stars) + "☆".repeat(5 - stars);
      els.resultTitle.textContent = mistakeTotal === 0 ? "全对！你是语法小达人！" : "完成啦，你正在变得更强！";
      els.resultText.textContent =
        "共完成 " + total + " 个小题，其中 " + firstTryCorrect +
        " 题一次答对，" + mistakeTotal + " 题经过提示后改正。";

      const pointMap = new Map();
      state.mistakes.forEach((record) => {
        if (!pointMap.has(record.point)) pointMap.set(record.point, 0);
        pointMap.set(record.point, pointMap.get(record.point) + 1);
      });

      els.reviewList.innerHTML = "";
      if (pointMap.size === 0) {
        els.reviewList.innerHTML =
          '<div class="review-item"><strong>本次没有错题</strong>继续保持：读句意、找标志词、检查动词形式。</div>';
      } else {
        const heading = document.createElement("h3");
        heading.textContent = "这次需要再复习的知识点";
        els.reviewList.appendChild(heading);
        [...pointMap.entries()]
          .sort((a, b) => b[1] - a[1])
          .forEach(([point, count]) => {
            const item = document.createElement("div");
            item.className = "review-item";
            item.innerHTML = "<strong>" + escapeHtml(point) + "</strong>本知识点共有 " + count + " 道题出现过错误。";
            els.reviewList.appendChild(item);
          });
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function findFirstUnfinished() {
      for (let groupIndex = 0; groupIndex < groups.length; groupIndex += 1) {
        for (let questionIndex = 0; questionIndex < groups[groupIndex].questions.length; questionIndex += 1) {
          if (!state.answers.get(groupIndex + "-" + questionIndex)?.correct) {
            return { groupIndex, questionIndex };
          }
        }
      }
      return null;
    }

    function restartAll() {
      state.groupIndex = 0;
      state.questionIndex = 0;
      state.answers.clear();
      state.mistakes.clear();
      els.resultArea.classList.remove("show");
      els.practiceArea.style.display = "grid";
      els.toolbar.style.display = "grid";
      renderQuestion();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    els.levelSelect.addEventListener("change", (event) => {
      state.groupIndex = Number(event.target.value);
      state.questionIndex = 0;
      renderQuestion();
    });
    els.nextBtn.addEventListener("click", goNext);
    els.prevBtn.addEventListener("click", goPrevious);
    els.restartBtn.addEventListener("click", restartAll);
    document.getElementById("topRestartBtn").addEventListener("click", restartAll);
    document.getElementById("resultTopBtn").addEventListener("click", restartAll);

    renderLevelOptions();
    renderQuestion();
  </script>
</body>
</html>
