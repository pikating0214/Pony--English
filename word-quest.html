<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pony English Word Quest</title>
  <style>
    :root {
      --ink: #202124;
      --muted: #69727f;
      --paper: #fffdf7;
      --cream: #fff6dc;
      --blue: #2364aa;
      --green: #2f8f5b;
      --orange: #f08a24;
      --pink: #d94f70;
      --line: rgba(32, 33, 36, 0.13);
      --shadow: 0 18px 45px rgba(42, 52, 70, 0.14);
      --radius: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 10%, rgba(255, 211, 99, 0.3), transparent 26rem),
        linear-gradient(135deg, #f7fbff 0%, #fffaf0 54%, #f2fff8 100%);
      min-height: 100vh;
    }

    button {
      font: inherit;
    }

    .app {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 18px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      gap: 18px;
      align-items: center;
      padding: 24px;
      min-height: 230px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 253, 247, 0.9);
      box-shadow: var(--shadow);
    }

    .kicker {
      margin: 0 0 8px;
      color: var(--green);
      font-weight: 800;
      letter-spacing: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 4.2rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .hero p {
      max-width: 720px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.4vw, 1.18rem);
      line-height: 1.7;
    }

    .pony {
      width: 200px;
      aspect-ratio: 1;
      position: relative;
      justify-self: center;
    }

    .pony::before,
    .pony::after {
      content: "";
      position: absolute;
      display: block;
    }

    .pony-body {
      position: absolute;
      inset: 44px 28px 22px 18px;
      border-radius: 55% 45% 46% 50%;
      background: linear-gradient(145deg, #d58b4e, #a65a31);
      border: 4px solid #5b3828;
    }

    .pony-head {
      position: absolute;
      width: 92px;
      height: 88px;
      right: 2px;
      top: 30px;
      border-radius: 48% 52% 46% 54%;
      background: linear-gradient(145deg, #e1a15f, #b86b3a);
      border: 4px solid #5b3828;
      z-index: 2;
    }

    .pony-ear {
      position: absolute;
      width: 28px;
      height: 42px;
      right: 54px;
      top: 8px;
      border-radius: 70% 20% 70% 20%;
      background: #c0713f;
      border: 4px solid #5b3828;
      transform: rotate(-18deg);
      z-index: 1;
    }

    .pony-mane {
      position: absolute;
      width: 44px;
      height: 102px;
      right: 76px;
      top: 26px;
      border-radius: 50% 20% 50% 40%;
      background: linear-gradient(#2b2f3a, #5c3142);
      transform: rotate(8deg);
      z-index: 1;
    }

    .pony-eye {
      position: absolute;
      width: 12px;
      height: 12px;
      right: 32px;
      top: 64px;
      border-radius: 50%;
      background: #1b1c1f;
      z-index: 3;
    }

    .pony-nose {
      position: absolute;
      width: 30px;
      height: 20px;
      right: 4px;
      top: 82px;
      border-radius: 45%;
      background: #f2d0ad;
      border: 3px solid #5b3828;
      z-index: 3;
    }

    .pony-tail {
      position: absolute;
      width: 82px;
      height: 116px;
      left: 0;
      top: 36px;
      border-radius: 80% 20% 70% 30%;
      border-left: 18px solid #5b3828;
      border-bottom: 16px solid #7e3142;
      transform: rotate(25deg);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin: 18px 0;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.82);
    }

    .level-tabs,
    .mode-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab,
    .small-btn {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--ink);
      padding: 9px 12px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .tab:hover,
    .small-btn:hover,
    .choice:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(42, 52, 70, 0.12);
    }

    .tab.is-active {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }

    .small-btn {
      font-weight: 800;
    }

    .game-grid {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.88);
      box-shadow: var(--shadow);
    }

    .side {
      padding: 16px;
      position: sticky;
      top: 12px;
    }

    .side h2,
    .card h2 {
      margin: 0 0 10px;
      font-size: 1.25rem;
      letter-spacing: 0;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 12px 0;
    }

    .stat {
      min-height: 72px;
      padding: 10px;
      border-radius: var(--radius);
      background: var(--cream);
      border: 1px solid rgba(240, 138, 36, 0.18);
    }

    .stat b {
      display: block;
      font-size: 1.35rem;
      margin-top: 4px;
    }

    .progress {
      height: 12px;
      border-radius: 999px;
      background: #e8edf3;
      overflow: hidden;
      margin: 12px 0;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--green), var(--blue));
      transition: width 0.25s ease;
    }

    .word-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 260px;
      overflow: auto;
      padding-right: 3px;
    }

    .chip {
      border-radius: 999px;
      border: 1px solid var(--line);
      padding: 5px 8px;
      background: #fff;
      font-size: 0.85rem;
      color: #3a4350;
    }

    .card {
      min-height: 520px;
      padding: clamp(16px, 3.5vw, 28px);
    }

    .level-title {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      color: var(--muted);
      font-weight: 800;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      border-radius: 999px;
      background: #e9f7ef;
      color: var(--green);
      padding: 5px 10px;
      font-size: 0.92rem;
    }

    .question {
      margin: 16px 0 10px;
      padding: 18px;
      border-radius: var(--radius);
      background: #f7fbff;
      border: 1px solid rgba(35, 100, 170, 0.16);
    }

    .question-type {
      margin: 0 0 8px;
      color: var(--pink);
      font-weight: 900;
    }

    .prompt {
      margin: 0;
      font-size: clamp(1.45rem, 4vw, 2.45rem);
      font-weight: 900;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .example {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.4vw, 1.18rem);
      line-height: 1.6;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .choice {
      min-height: 70px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: 12px;
      text-align: left;
      cursor: pointer;
      font-weight: 800;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .choice.correct {
      background: #e9f7ef;
      border-color: #7cc89d;
    }

    .choice.wrong {
      background: #fff0f3;
      border-color: #f2a0b4;
    }

    .feedback {
      min-height: 58px;
      margin-top: 14px;
      padding: 12px;
      border-radius: var(--radius);
      background: #fffaf0;
      border: 1px solid rgba(240, 138, 36, 0.22);
      color: #714719;
      line-height: 1.5;
      font-weight: 700;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .primary {
      min-height: 46px;
      border: 0;
      border-radius: var(--radius);
      background: var(--orange);
      color: #fff;
      padding: 11px 16px;
      font-weight: 900;
      cursor: pointer;
    }

    .primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .result {
      display: none;
      text-align: center;
      padding: 24px 8px;
    }

    .result.is-visible {
      display: block;
    }

    .stars {
      font-size: clamp(2rem, 9vw, 4rem);
      letter-spacing: 0;
      color: #f5aa23;
      margin: 10px 0;
    }

    .sticker {
      width: 118px;
      height: 118px;
      margin: 10px auto;
      border-radius: 50%;
      background: #e9f7ef;
      border: 6px solid #78bf92;
      position: relative;
    }

    .sticker::before,
    .sticker::after {
      content: "";
      position: absolute;
      top: 42px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #202124;
    }

    .sticker::before {
      left: 33px;
    }

    .sticker::after {
      right: 33px;
    }

    .smile {
      position: absolute;
      left: 33px;
      top: 60px;
      width: 44px;
      height: 22px;
      border-bottom: 6px solid #202124;
      border-radius: 0 0 50px 50px;
    }

    .teacher-note {
      margin-top: 18px;
      padding: 16px;
      border-radius: var(--radius);
      border: 1px dashed rgba(35, 100, 170, 0.32);
      background: rgba(255, 255, 255, 0.76);
      color: var(--muted);
      line-height: 1.65;
    }

    @media (max-width: 860px) {
      .hero,
      .game-grid {
        grid-template-columns: 1fr;
      }

      .hero {
        padding: 18px;
      }

      .pony {
        width: 156px;
      }

      .side {
        position: static;
      }
    }

    @media (max-width: 560px) {
      .app {
        padding: 10px;
      }

      .choices,
      .stats {
        grid-template-columns: 1fr;
      }

      .toolbar {
        align-items: stretch;
      }

      .level-tabs,
      .mode-tabs,
      .small-btn,
      .tab {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero" aria-label="Game introduction">
      <div>
        <p class="kicker">Appendix 2 Review Game</p>
        <h1>Pony English Word Quest</h1>
        <p>每一关都会检查单词、词组和例句理解。答错时页面只给小提示，不直接显示答案，学生可以再试一次。</p>
      </div>
      <div class="pony" aria-hidden="true">
        <div class="pony-tail"></div>
        <div class="pony-mane"></div>
        <div class="pony-ear"></div>
        <div class="pony-body"></div>
        <div class="pony-head"></div>
        <div class="pony-eye"></div>
        <div class="pony-nose"></div>
      </div>
    </section>

    <section class="toolbar" aria-label="Game controls">
      <div class="level-tabs" id="levelTabs"></div>
      <div class="mode-tabs">
        <button class="small-btn" id="shuffleBtn" type="button">打乱本关</button>
        <button class="small-btn" id="restartBtn" type="button">重新开始</button>
      </div>
    </section>

    <section class="game-grid">
      <aside class="panel side">
        <h2 id="sideTitle">Unit 1</h2>
        <div class="stats">
          <div class="stat">进度 <b id="progressText">1/1</b></div>
          <div class="stat">得分 <b id="scoreText">0</b></div>
          <div class="stat">星星 <b id="starText">0</b></div>
          <div class="stat">覆盖 <b id="coverageText">0词</b></div>
        </div>
        <div class="progress" aria-label="progress">
          <div class="bar" id="bar"></div>
        </div>
        <h2>本关词汇</h2>
        <div class="word-list" id="wordList"></div>
      </aside>

      <section class="panel card" id="gameCard">
        <div class="level-title">
          <span class="badge" id="levelBadge">Level 1</span>
          <span id="missionText">Read and choose.</span>
        </div>

        <div id="quizArea">
          <div class="question">
            <p class="question-type" id="questionType">Question</p>
            <p class="prompt" id="prompt">Ready?</p>
            <p class="example" id="example"></p>
          </div>
          <div class="choices" id="choices"></div>
          <div class="feedback" id="feedback">选择一个答案开始闯关。</div>
          <div class="actions">
            <button class="small-btn" id="prevBtn" type="button">上一题</button>
            <button class="primary" id="nextBtn" type="button" disabled>下一题</button>
          </div>
        </div>

        <div class="result" id="resultArea">
          <div class="sticker"><span class="smile"></span></div>
          <h2 id="resultTitle">Great try!</h2>
          <div class="stars" id="resultStars">☆☆☆☆☆</div>
          <p id="resultText"></p>
          <button class="primary" id="againBtn" type="button">再玩一次本关</button>
        </div>
      </section>
    </section>

    <section class="teacher-note">
      老师使用建议：先让学生按 Unit 闯关，再让基础较弱的学生只做“看英文选中文”，强一点的学生挑战“例句补全”和“中文选英文”。页面不会记录学生隐私或上传成绩。
    </section>
  </main>

          ["pen pal", "笔友", "My pen pal lives in Canberra.", "通过写信交流的朋友。"],
          ["hobby", "业余爱好", "Her hobby is reading comic books.", "喜欢做的事。"],
          ["jasmine", "茉莉", "Jasmine is a beautiful flower.", "一种花。"],
          ["idea", "想法；主意", "That is a good idea.", "脑中的计划。"],
          ["Canberra", "堪培拉", "Canberra is the capital of Australia.", "澳大利亚首都。"],
          ["amazing", "令人惊奇的", "The space film is amazing.", "让人惊讶、赞叹。"],
          ["shall", "表示征求意见", "Shall we join the club?", "提出建议时用。"],
          ["goal", "射门", "He kicks the ball into the goal.", "足球相关。"],
          ["join", "加入", "I want to join the science club.", "成为其中一员。"],
          ["club", "俱乐部", "The hiking club meets on Sunday.", "兴趣小组。"],
          ["share", "分享", "Share your idea with your pen pal.", "把东西或想法给别人。"]
        ]
      },
      {
        id: "u5",
        label: "Unit 5",
        badge: "Level 5",
        mission: "Jobs and workplaces",
        items: [
          ["factory", "工厂", "My uncle works in a factory.", "生产东西的地方。"],
          ["worker", "工人", "The worker is in the factory.", "在工厂工作的人。"],
          ["postman", "邮递员", "The postman sends postcards.", "送信的人。"],
          ["businessman", "商人；企业家", "The businessman travels by plane.", "做生意的人。"],
          ["police officer", "警察", "The police officer helps people.", "保护安全的人。"],
          ["fisherman", "渔民", "The fisherman works at sea.", "捕鱼的人。"],
          ["scientist", "科学家", "The scientist studies space.", "研究科学的人。"],
          ["pilot", "飞行员", "The pilot flies a plane.", "开飞机的人。"],
          ["coach", "教练", "The coach teaches football.", "训练队员的人。"],
          ["country", "国家", "Germany is a country.", "如 China, Germany。"],
          ["head teacher", "校长", "The head teacher speaks to everyone.", "学校负责人。"],
          ["sea", "大海", "The ship is on the sea.", "大片水域。"],
          ["stay", "保持", "Stay happy and keep learning.", "保持某种状态。"],
          ["university", "大学", "She studies at university.", "高等学校。"],
          ["gym", "体育馆", "The coach is in the gym.", "运动场所。"],
          ["if", "如果", "If you are ill, see a doctor.", "表示条件。"],
          ["reporter", "记者", "The reporter asks questions.", "采访和报道的人。"],
          ["use", "使用", "Use BDS to find the street.", "拿来帮助做事。"],
          ["type", "打字", "The secretary can type quickly.", "用键盘输入。"],
          ["quickly", "迅速地", "The pilot walks quickly.", "速度快地做事。"],
          ["secretary", "秘书", "The secretary types a letter.", "办公室工作者。"]
        ]
      },
      {
        id: "u6",
        label: "Unit 6",
        badge: "Level 6",
        mission: "Feelings and health",
        items: [
          ["angry", "生气的", "The boy is angry.", "不开心且有点发火。"],
          ["afraid", "害怕", "The ant is afraid of the mice.", "感到害怕。"],
          ["sad", "难过的", "She is sad today.", "心情不好。"],
          ["worried", "担心的；发愁的", "I am worried about my friend.", "心里放不下。"],
          ["happy", "高兴的", "Everyone is happy.", "心情好。"],
          ["see a doctor", "看病", "You should see a doctor.", "生病时做的事。"],
          ["wear more", "多穿", "Wear more clothes when it is cold.", "包含 wear 和 more。"],
          ["take a deep breath", "深深吸一口气", "Take a deep breath and count to ten.", "包含 deep 和 breath。"],
          ["count to ten", "数到十", "Count to ten when you are angry.", "包含 count。"],
          ["chase", "追赶", "The cat will chase the mice.", "在后面追。"],
          ["mice", "老鼠", "The mice are under the table.", "mouse 的复数。"],
          ["bad", "邪恶的；坏的", "That is a bad idea.", "不好的。"],
          ["hurt", "使受伤", "Do not hurt the ant.", "让身体受伤。"],
          ["ill", "有病；不舒服", "He is ill today.", "身体不舒服。"],
          ["wrong", "有毛病", "What is wrong?", "出问题时问。"],
          ["should", "应该", "You should take a deep breath.", "提出建议。"],
          ["feel", "觉得；感到", "How do you feel?", "询问感受。"],
          ["well", "健康；身体好", "I feel well now.", "身体状态好。"],
          ["sit", "坐", "Sit on the grass.", "身体动作。"],
          ["grass", "草坪", "The ant is on the grass.", "绿色植物地面。"],
          ["hear", "听见", "Can you hear everyone?", "用耳朵感知声音。"],
          ["ant", "蚂蚁", "The ant is small.", "小昆虫。"],
          ["worry", "担心；担忧", "Do not worry.", "动词形式。"],
          ["stuck", "陷住；无法移动", "The mouse is stuck in the mud.", "不能动了。"],
          ["mud", "泥", "The shoes are in the mud.", "湿土。"],
          ["pull", "拉；拽", "Pull the sled, please.", "向自己方向用力。"],
          ["everyone", "每人", "Everyone can help.", "所有人。"]
        ]
      }
    ];

    const encouragement = [
      "Good thinking! Look at the meaning clue and try again.",
      "Nice try! Read the example sentence one more time.",
      "Almost there! Check the key word in the sentence.",
      "Keep going! The hint can help you choose."
    ];

    let levelIndex = 0;
    let order = [];
    let cardIndex = 0;
    let score = 0;
    let stars = 0;
    let answered = new Map();

    const els = {
      tabs: document.getElementById("levelTabs"),
      sideTitle: document.getElementById("sideTitle"),
      progressText: document.getElementById("progressText"),
      scoreText: document.getElementById("scoreText"),
      starText: document.getElementById("starText"),
      coverageText: document.getElementById("coverageText"),
      bar: document.getElementById("bar"),
      wordList: document.getElementById("wordList"),
      levelBadge: document.getElementById("levelBadge"),
      missionText: document.getElementById("missionText"),
      questionType: document.getElementById("questionType"),
      prompt: document.getElementById("prompt"),
      example: document.getElementById("example"),
      choices: document.getElementById("choices"),
      feedback: document.getElementById("feedback"),
      prevBtn: document.getElementById("prevBtn"),
      nextBtn: document.getElementById("nextBtn"),
      shuffleBtn: document.getElementById("shuffleBtn"),
      restartBtn: document.getElementById("restartBtn"),
      quizArea: document.getElementById("quizArea"),
      resultArea: document.getElementById("resultArea"),
      resultTitle: document.getElementById("resultTitle"),
      resultStars: document.getElementById("resultStars"),
      resultText: document.getElementById("resultText"),
      againBtn: document.getElementById("againBtn")
    };

    function shuffle(list) {
      const copy = [...list];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function getLevel() {
      return levels[levelIndex];
    }

    function questionKind(item, index) {
      const term = item[0];
      if (term.includes(" ") || index % 4 === 2) return "例句或词组理解";
      if (index % 4 === 1) return "看中文选英文";
      if (index % 4 === 3) return "例句补全";
      return "看英文选中文";
    }

    function maskTerm(example, term) {
      const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return example.replace(new RegExp(escaped, "i"), "____");
    }

    function buildQuestion(item, index) {
      const [term, meaning, example, hint] = item;
      const kind = questionKind(item, index);
      const pool = getLevel().items.filter((other) => other !== item);
      const wrongMeanings = shuffle(pool.map((other) => other[1])).slice(0, 3);
      const wrongTerms = shuffle(pool.map((other) => other[0])).slice(0, 3);

      if (kind === "看中文选英文") {
        return {
          kind,
          prompt: meaning,
          example: "Choose the correct English.",
          answer: term,
          choices: shuffle([term, ...wrongTerms]),
          hint
        };
      }

      if (kind === "例句补全") {
        return {
          kind,
          prompt: maskTerm(example, term),
          example: "Which word or phrase completes the sentence?",
          answer: term,
          choices: shuffle([term, ...wrongTerms]),
          hint
        };
      }

      if (kind === "例句或词组理解") {
        return {
          kind,
          prompt: term,
          example,
          answer: meaning,
          choices: shuffle([meaning, ...wrongMeanings]),
          hint
        };
      }

      return {
        kind,
        prompt: term,
        example,
        answer: meaning,
        choices: shuffle([meaning, ...wrongMeanings]),
        hint
      };
    }

    function renderTabs() {
      els.tabs.innerHTML = "";
      levels.forEach((level, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "tab" + (index === levelIndex ? " is-active" : "");
        button.textContent = level.label;
        button.addEventListener("click", () => startLevel(index, false));
        els.tabs.appendChild(button);
      });
    }

    function startLevel(index, shouldShuffle) {
      levelIndex = index;
      const level = getLevel();
      order = shouldShuffle ? shuffle(level.items) : [...level.items];
      cardIndex = 0;
      score = 0;
      stars = 0;
      answered = new Map();
      els.quizArea.style.display = "block";
      els.resultArea.classList.remove("is-visible");
      renderTabs();
      renderSide();
      renderCard();
    }

    function renderSide() {
      const level = getLevel();
      els.sideTitle.textContent = level.label;
      els.coverageText.textContent = level.items.length + "词";
      els.wordList.innerHTML = "";
      level.items.forEach(([term]) => {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = term;
        els.wordList.appendChild(chip);
      });
      updateStats();
    }

    function updateStats() {
      const total = order.length || 1;
      els.progressText.textContent = Math.min(cardIndex + 1, total) + "/" + total;
      els.scoreText.textContent = score;
      els.starText.textContent = stars;
      els.bar.style.width = Math.round((answered.size / total) * 100) + "%";
    }

    function renderCard() {
      const level = getLevel();
      const item = order[cardIndex];
      const question = buildQuestion(item, cardIndex);
      const state = answered.get(cardIndex);

      els.levelBadge.textContent = level.badge;
      els.missionText.textContent = level.mission;
      els.questionType.textContent = question.kind;
      els.prompt.textContent = question.prompt;
      els.example.textContent = question.example;
      els.feedback.textContent = state ? state.message : "选择一个答案。";
      els.nextBtn.disabled = !state;
      els.prevBtn.disabled = cardIndex === 0;
      els.nextBtn.textContent = cardIndex === order.length - 1 ? "查看结果" : "下一题";
      els.choices.innerHTML = "";

      question.choices.forEach((choice) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice";
        button.textContent = choice;
        if (state) {
          button.disabled = true;
          if (choice === state.choice && state.correct) button.classList.add("correct");
          if (choice === state.choice && !state.correct) button.classList.add("wrong");
        }
        button.addEventListener("click", () => chooseAnswer(choice, question));
        els.choices.appendChild(button);
      });

      updateStats();
    }

    function chooseAnswer(choice, question) {
      if (answered.has(cardIndex)) return;

      const correct = choice === question.answer;
      if (correct) {
        score += 10;
        stars += 1;
      }

      const message = correct
        ? "Great! You found the meaning in English and Chinese."
        : encouragement[Math.floor(Math.random() * encouragement.length)] + " Hint: " + question.hint;

      answered.set(cardIndex, { choice, correct, message });
      renderCard();
    }

    function showResult() {
      const total = order.length;
      const correctCount = [...answered.values()].filter((item) => item.correct).length;
      const starCount = Math.max(1, Math.ceil((correctCount / total) * 5));
      els.quizArea.style.display = "none";
      els.resultArea.classList.add("is-visible");
      els.resultTitle.textContent = correctCount >= Math.ceil(total * 0.85)
        ? "Super star listening and reading!"
        : "Great try! You are getting stronger!";
      els.resultStars.textContent = "★★★★★".slice(0, starCount) + "☆☆☆☆☆".slice(0, 5 - starCount);
      els.resultText.textContent = `本关完成：${correctCount}/${total} 题正确，得分 ${score}。再练一次会更熟。`;
      els.bar.style.width = "100%";
    }

    els.prevBtn.addEventListener("click", () => {
      if (cardIndex > 0) {
        cardIndex -= 1;
        renderCard();
      }
    });

    els.nextBtn.addEventListener("click", () => {
      if (cardIndex === order.length - 1) {
        showResult();
        return;
      }
      cardIndex += 1;
      renderCard();
    });

    els.shuffleBtn.addEventListener("click", () => startLevel(levelIndex, true));
    els.restartBtn.addEventListener("click", () => startLevel(levelIndex, false));
    els.againBtn.addEventListener("click", () => startLevel(levelIndex, true));

    startLevel(0, false);
  </script>
</body>
